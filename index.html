<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playlist from Google Sheets</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Space Grotesk',sans-serif;user-select:none;-webkit-user-select:none}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#0a0a0a}

/* ── background ── */
.bg-layer{
  position:fixed;inset:0;z-index:0;
  background-size:cover;background-position:center;
  filter:blur(60px) saturate(2.2) brightness(0.52);
  transform:scale(1.15);
  transition:opacity 1.1s ease, background 1.1s ease;
  will-change:opacity;
}
#bg-a{opacity:1}
#bg-b{opacity:0}

.netflix-fallback {
  background: linear-gradient(135deg, #141414 0%, #0f0505 50%, #1a0505 100%) !important;
  background-size: 400% 400% !important;
  animation: netflixMove 15s ease infinite !important;
}
@keyframes netflixMove {
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.055}
.vignette{position:fixed;inset:0;z-index:2;pointer-events:none;background: radial-gradient(ellipse 120% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%)}
.fade-top{position:fixed;top:0;left:0;right:0;height:42vh;z-index:2;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,0.62) 0%,transparent 100%)}
.fade-bot{position:fixed;bottom:0;left:0;right:0;height:38vh;z-index:2;pointer-events:none;background:linear-gradient(to top,rgba(0,0,0,0.75) 0%,transparent 100%)}

/* ── drum ── */
.drum-wrap{position:relative;z-index:3;width:100%;max-width:640px;height:100vh;overflow:hidden;display:flex;align-items:center;justify-content:center}
.drum{width:100%;padding:0 44px;display:flex;flex-direction:column;align-items:center;color:#fff}
.track{text-align:center;cursor:pointer;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;display: none}
.track .title,.track .artist{display:block;transition:opacity 0.35s ease, transform 0.35s ease}
.track.animating .title,.track.animating .artist{opacity:0;transform:translateY(-6px)}

.track[data-dist="0"], .track[data-dist="1"] {display: block}
.track[data-dist="0"]{padding:12px 0}
.track[data-dist="0"] .title{font-size:30px;font-weight:600;color:#fff;letter-spacing:-0.025em;line-height:1.15;text-shadow:0 2px 32px rgba(0,0,0,0.45)}
.track[data-dist="0"] .artist{font-size:12.5px;font-weight:300;color:rgba(255,255,255,0.58);letter-spacing:0.08em;text-transform:uppercase;margin-top:6px;text-shadow:0 1px 14px rgba(0,0,0,0.35)}
.track[data-dist="1"]{padding:9px 0}
.track[data-dist="1"] .title{font-size:18px;font-weight:400;color:rgba(255,255,255,0.44);letter-spacing:-0.01em}
.track[data-dist="1"] .artist{font-size:10.5px;font-weight:300;color:rgba(255,255,255,0.2);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px}

/* ── player bar ── */
#bar{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;align-items:center;gap:clamp(10px,2.2vw,18px);
  padding:clamp(10px,1.8vw,13px) clamp(14px,2.8vw,22px);border-radius:22px;
  background:rgba(255,255,255,0.09);backdrop-filter:blur(36px) saturate(1.9);-webkit-backdrop-filter:blur(36px) saturate(1.9);
  border:1px solid rgba(255,255,255,0.13);box-shadow:0 8px 40px rgba(0,0,0,0.38),inset 0 1px 0 rgba(255,255,255,0.11);
  white-space:nowrap;max-width:calc(100vw - 32px);
}
.ctrl{background:none;border:none;cursor:pointer;color:rgba(255,255,255,0.38);padding:clamp(3px,0.8vw,5px);transition:color 0.15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ctrl:hover{color:rgba(255,255,255,0.88)}
.ctrl svg{display:block;width:clamp(13px,3.2vw,16px);height:clamp(13px,3.2vw,16px);fill:currentColor}
#pp svg{width:clamp(15px,3.8vw,19px);height:clamp(15px,3.8vw,19px)}
#pp{color:rgba(255,255,255,0.9)}
#shuf.on{color:rgba(255,255,255,0.9)}
.prog-wrap{display:flex;align-items:center;gap:clamp(6px,1.4vw,9px);flex:1;min-width:0}
.prog-track{flex:1;height:2px;background:rgba(255,255,255,0.14);border-radius:999px;cursor:pointer;position:relative;min-width:50px}
#prog-fill{height:100%;background:rgba(255,255,255,0.78);border-radius:999px;width:0%;pointer-events:none;transition:width 0.4s linear}
.time{font-size:clamp(9.5px,2.2vw,11px);font-weight:300;color:rgba(255,255,255,0.3);min-width:0;letter-spacing:0.01em;flex-shrink:0}
#tc{text-align:right}

/* ── add track panel ── */
#add-panel{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:20;
  display:none;flex-direction:column;gap:10px;padding:16px 18px;border-radius:18px;
  background:rgba(15,15,15,0.82);backdrop-filter:blur(40px) saturate(1.8);-webkit-backdrop-filter:blur(40px) saturate(1.8);
  border:1px solid rgba(255,255,255,0.11);box-shadow:0 8px 40px rgba(0,0,0,0.55);width:calc(100vw - 32px);max-width:380px;
}
#add-panel.open{display:flex}
#add-panel label{font-size:10px;font-weight:500;color:rgba(255,255,255,0.38);letter-spacing:0.08em;text-transform:uppercase}
#url-input{
  background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);border-radius:10px;
  color:#fff;font-family:'Space Grotesk',sans-serif;font-size:13px;padding:9px 12px;outline:none;width:100%;transition:border-color 0.15s;
}
#url-input:focus{border-color:rgba(255,255,255,0.3)}
#url-input::placeholder{color:rgba(255,255,255,0.2)}
#yt-wrap{position:fixed;left:-9999px;bottom:-9999px;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>

<div class="bg-layer" id="bg-a"></div>
<div class="bg-layer" id="bg-b"></div>
<canvas id="grain"></canvas>
<div class="vignette"></div>
<div class="fade-top"></div>
<div class="fade-bot"></div>
<div id="yt-wrap"><div id="yt-player"></div></div>

<div id="add-panel">
  <label id="input-label">Додати новий трек (Enter)</label>
  <input type="text" id="url-input" placeholder="Встав посилання на YouTube і натисни Enter">
</div>

<div class="drum-wrap">
  <div class="drum" id="drum">
    <div style="color: #fff; font-size: 14px;">Завантаження плейлиста...</div>
  </div>
</div>

<div id="bar">
  <button class="ctrl" id="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
  <button class="ctrl" id="pp"><svg id="pp-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
  <button class="ctrl" id="next"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm2.5-6 6-4.3v8.6L8.5 12zM16 6h2v12h-2z"/></svg></button>
  <div class="prog-wrap">
    <span class="time" id="tc">0:00</span>
    <div class="prog-track" id="prog-track"><div id="prog-fill"></div></div>
    <span class="time" id="td">0:00</span>
  </div>
  <button class="ctrl" id="shuf" title="Shuffle"><svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
</div>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTcXHD4X8uDWvbV9Q68yAvliNDG4GdEmMyEE09kA8bMtDcrXIFwS_N3qqeCIaK8YTynQXN3pGdQC1Ya/pub?output=csv';
// ВСТАВ СЮДИ URL ВЕБ-ДОДАТКУ APPS SCRIPT, ЯКИЙ СКОПІЮВАВ У КРОЦІ 1
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzeYYb26x-KKUt-hVauGyMrx1IzlCnpJoCAmDF88sInusxzknXNpwmOUOub78XoHJZhnQ/exec'; 

let tracks = [];
const WINDOW = 4;
let cur = 0, playing = false, shuffleOn = false;
let queue = [];
let yt = null, ytOk = false, timer = null;
let bgActive = 'a';

// ── Grain noise ──
(function initGrain(){
  const canvas = document.getElementById('grain'); const ctx = canvas.getContext('2d'); let w, h, frame = 0;
  function resize(){ w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);
  function drawGrain(){
    frame++; if (frame % 3 !== 0) { requestAnimationFrame(drawGrain); return; }
    const imgd = ctx.createImageData(w, h); const data = imgd.data;
    for (let i = 0; i < data.length; i += 4) { const v = Math.random() * 255 | 0; data[i] = data[i+1] = data[i+2] = v; data[i+3] = 255; }
    ctx.putImageData(imgd, 0, 0); requestAnimationFrame(drawGrain);
  }
  drawGrain();
})();

// ── Fullscreen on Double Click ──
document.addEventListener('dblclick', (e) => {
  if(e.target.closest('#bar') || e.target.closest('#add-panel')) return;
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen().catch(() => {}); } 
  else { document.exitFullscreen(); }
});

// ── Parse CSV rows helper ──
function parseRows(data) {
  const rows = data.split('\n').slice(1);
  return rows.map(row => {
    const parts = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
    if (parts && parts.length >= 4) {
      return {
        title: parts[2].replace(/"/g, '').trim(),
        artist: parts[3].replace(/"/g, '').trim(),
        yt: parts[1].replace(/"/g, '').trim()
      };
    }
    return null;
  }).filter(t => t && t.yt && t.yt !== "#N/A" && t.yt !== "Loading...");
}

// ── Load Tracks ──
async function loadTracks() {
  const cached = localStorage.getItem('music_playlist_cache');
  if (cached) { try { tracks = JSON.parse(cached); initPlaylistState(); } catch(e) { localStorage.removeItem('music_playlist_cache'); } }
  try {
    const response = await fetch(SHEET_CSV_URL); const data = await response.text(); const freshTracks = parseRows(data);
    if (freshTracks.length === 0) throw new Error("No tracks found");
    if (JSON.stringify(freshTracks) !== JSON.stringify(tracks)) {
      tracks = freshTracks; localStorage.setItem('music_playlist_cache', JSON.stringify(tracks));
      const currentTrackId = tracks[queue[cur]] ? tracks[queue[cur]].yt : null;
      queue = tracks.map((_, i) => i);
      if (shuffleOn) { applyShuffle(currentTrackId); }
      else if (currentTrackId) { cur = tracks.findIndex(t => t.yt === currentTrackId) || 0; }
      buildDrum(); updateDrum(); setBackground(tracks[queue[cur]]); updateMediaSession();
    }
  } catch (e) { if (tracks.length === 0) { document.getElementById('drum').innerHTML = '<div style="color:red">Помилка завантаження! Перевір посилання.</div>'; } }
}

function initPlaylistState() { queue = tracks.map((_, i) => i); buildDrum(); updateDrum(); setBackground(tracks[queue[0]]); }

// ── background ──
function setBackground(track) {
  if (!track) return;
  const next = bgActive === 'a' ? 'b' : 'a'; const layerNext = document.getElementById('bg-'+next); const layerCur = document.getElementById('bg-'+bgActive);
  const img = new Image();
  function triggerFallback() {
    if (img.src.includes('maxresdefault')) { img.src = `https://i.ytimg.com/vi/${track.yt}/mqdefault.jpg`; } 
    else { layerNext.style.backgroundImage = 'none'; layerNext.className = 'bg-layer netflix-fallback'; switchLayers(layerNext, layerCur, next); }
  }
  img.onerror = triggerFallback;
  img.onload = () => {
    if (img.naturalWidth === 120 && img.naturalHeight === 90) { triggerFallback(); return; }
    layerNext.className = 'bg-layer'; layerNext.style.backgroundImage = `url('${img.src}')`; switchLayers(layerNext, layerCur, next);
  };
  img.src = `https://i.ytimg.com/vi/${track.yt}/maxresdefault.jpg`;
}
function switchLayers(layerNext, layerCur, next) { requestAnimationFrame(() => { layerNext.style.opacity = '1'; layerCur.style.opacity = '0'; bgActive = next; }); }

// ── Media Session API ──
function updateMediaSession() {
  if ('mediaSession' in navigator && tracks[queue[cur]]) {
    const t = tracks[queue[cur]];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.title, artist: t.artist, album: 'My Space Player',
      artwork: [{ src: `https://i.ytimg.com/vi/${t.yt}/maxresdefault.jpg`, sizes: '1280x720', type: 'image/jpeg' }]
    });
    navigator.mediaSession.setActionHandler('play', () => { togglePlayback(true); });
    navigator.mediaSession.setActionHandler('pause', () => { togglePlayback(false); });
    navigator.mediaSession.setActionHandler('previoustrack', goPrev);
    navigator.mediaSession.setActionHandler('nexttrack', goNext);
  }
}

// ── drum ──
function buildDrum() {
  const drum = document.getElementById('drum'); drum.innerHTML = '';
  for (let i = 0; i < WINDOW*2+1; i++) {
    const div = document.createElement('div'); div.className = 'track'; div.innerHTML = '<span class="title"></span><span class="artist"></span>';
    div.addEventListener('click', () => {
      const offset = parseInt(div.dataset.offset);
      if (!isNaN(offset) && offset !== 0) { const np = cur + offset; if (np >= 0 && np < queue.length) { cur = np; play(); } }
    });
    drum.appendChild(div);
  }
}

function updateDrum() {
  const nodes = document.getElementById('drum').children; if (!nodes.length || !tracks[queue[cur]]) return;
  for (let i = 0; i < nodes.length; i++) {
    const offset = i - WINDOW, qPos = cur + offset, el = nodes[i]; el.dataset.offset = offset; el.dataset.dist = Math.min(Math.abs(offset), 4);
    if (qPos < 0 || qPos >= queue.length) { el.querySelector('.title').textContent = ''; el.querySelector('.artist').textContent = ''; el.style.pointerEvents = 'none'; } 
    else {
      const t = tracks[queue[qPos]]; el.querySelector('.title').textContent = t.title; el.querySelector('.artist').textContent = t.artist;
      el.style.pointerEvents = offset === 0 ? 'none' : 'auto';
    }
  }
  document.title = `${tracks[queue[cur]].title} — ${tracks[queue[cur]].artist}`;
}

function animateDrum(cb) {
  const center = document.getElementById('drum').children[WINDOW]; if (!center) { cb(); return; }
  center.classList.add('animating'); setTimeout(() => { cb(); requestAnimationFrame(() => center.classList.remove('animating')); }, 200);
}

// ── playback ──
const ppIcon = document.getElementById('pp-icon');
function play() {
  playing = true; animateDrum(() => updateDrum()); setBackground(tracks[queue[cur]]);
  ppIcon.querySelector('path').setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z');
  if (ytOk) { yt.loadVideoById(tracks[queue[cur]].yt); yt.playVideo(); }
  if (timer) clearInterval(timer); timer = setInterval(tick, 500); updateMediaSession();
}

function togglePlayback(shouldPlay) {
  if (!ytOk) return; playing = shouldPlay !== undefined ? shouldPlay : !playing;
  if (playing) { yt.playVideo(); ppIcon.querySelector('path').setAttribute('d', 'M6 19h4V5H6v14zm8-14v14h4V5h-4z'); } 
  else { yt.pauseVideo(); ppIcon.querySelector('path').setAttribute('d', 'M8 5v14l11-7z'); }
}

function tick() {
  if (!ytOk || !yt.getDuration) return; const d = yt.getDuration(), c = yt.getCurrentTime();
  if (d > 0) { document.getElementById('prog-fill').style.width = (c/d*100)+'%'; document.getElementById('tc').textContent = fmt(c); document.getElementById('td').textContent = fmt(d); }
}
function fmt(s){ return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'); }
function goNext(){ if(cur<queue.length-1){cur++;play();} }
function goPrev(){ if(cur>0){cur--;play();} }

document.getElementById('pp').addEventListener('click', () => togglePlayback());
document.getElementById('next').addEventListener('click', goNext);
document.getElementById('prev').addEventListener('click', goPrev);

function applyShuffle(currentTrackId) {
  const ci = currentTrackId ? tracks.findIndex(t => t.yt === currentTrackId) : queue[cur];
  let rest = tracks.map((_,i)=>i).filter(i=>i!==ci);
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]];}
  queue=[ci,...rest]; cur=0;
}

document.getElementById('shuf').addEventListener('click', () => {
  shuffleOn = !shuffleOn; document.getElementById('shuf').classList.toggle('on', shuffleOn); const ci = queue[cur];
  if (shuffleOn) { applyShuffle(tracks[ci]?.yt); } else { queue=tracks.map((_,i)=>i); cur=queue.indexOf(ci); }
  updateDrum();
});

document.getElementById('prog-track').addEventListener('click', (e) => {
  if(!ytOk)return; const r=e.currentTarget.getBoundingClientRect(); yt.seekTo(yt.getDuration()*(e.clientX-r.left)/r.width,true);
});

// ── YouTube API ──
window.onYouTubeIframeAPIReady = () => {
  yt = new YT.Player('yt-player', {
    height:'1', width:'1', videoId:'', playerVars:{ autoplay:0, controls:0 },
    events:{ onReady: () => { ytOk = true; loadTracks(); }, onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) goNext(); } }
  });
};
const tag = document.createElement('script'); tag.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(tag);

// ── Додавання треку через URL інпут ──
const urlInput = document.getElementById('url-input');
const inputLabel = document.getElementById('input-label');

urlInput.addEventListener('keydown', async (e) => {
  if (e.key === 'Enter') {
    const url = urlInput.value.trim();
    if (!url) return;
    
    inputLabel.textContent = "Надсилання й обробка...";
    urlInput.disabled = true;
    
    try {
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ url: url })
      });
      const result = await response.json();
      
      if (result.status === 'success') {
        inputLabel.textContent = "Успішно додано!";
        urlInput.value = '';
        
        // МИТТЄВО додаємо трек у локальну бібліотеку сайту без запитів до мережі
        tracks.push(result.track);
        localStorage.setItem('music_playlist_cache', JSON.stringify(tracks));
        
        // Якщо це був перший трек
        if (tracks.length === 1) {
          initPlaylistState();
        } else {
          // Оновлюємо чергу треків
          const currentTrackId = tracks[queue[cur]] ? tracks[queue[cur]].yt : null;
          queue = tracks.map((_, i) => i);
          if (shuffleOn) { applyShuffle(currentTrackId); }
          else if (currentTrackId) { cur = tracks.findIndex(t => t.yt === currentTrackId) || 0; }
          
          buildDrum();
          updateDrum();
        }
      } else {
        inputLabel.textContent = "Помилка: " + (result.message || "невідома");
      }
    } catch (err) {
      inputLabel.textContent = "Помилка мережі/налаштувань Apps Script!";
    }
    
    urlInput.disabled = false;
    setTimeout(() => { inputLabel.textContent = "Додати новий трек (Enter)"; }, 3000);
  }
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return; // Не перемикаємо панель, якщо пишемо в інпуті
  if (e.key === 'a' || e.key === 'A') {
    const panel = document.getElementById('add-panel');
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) urlInput.focus();
  }
});
</script>
</body>
</html>
